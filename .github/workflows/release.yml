name: Windows release

# Push a tag like v0.2.0 to build STS2ModLoader.exe on Windows and attach it to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Run tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name STS2ModLoader
          --collect-submodules sts2mods
          "STS2 Mod Loader.pyw"

      - name: Smoke test (imports and Steam helper entry point)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "helper.json"
          $p = Start-Process dist\STS2ModLoader.exe -ArgumentList "--steam-helper", $out, "state", "C:\nonexistent\steam_api64.dll", "1" -Wait -PassThru
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern '"ok": false' -Quiet)) { throw "helper did not report back" }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/STS2ModLoader.exe \
            --title "STS2 Mod Loader $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Windows build: download **STS2ModLoader.exe** and double-click it. No Python needed.

          Windows SmartScreen may warn about an unrecognized app (the .exe isn't code-signed): click **More info → Run anyway**. Some antivirus tools flag PyInstaller-built apps; this one is built from this repository's source by GitHub Actions.

          Linux and macOS: see the README (run from source with Python 3).

          Pre-release: this is the first Windows build and hasn't been tested on a real Windows install with the game yet."
